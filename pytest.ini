[pytest]
testpaths = tests
markers =
    slow: pruebas lentas (año completo, rendimiento, UI completa, dorados)
    perf: presupuestos de rendimiento de arquitectura §10 (tolerantes; imprimir tiempos con -s)
    needs_spice: requiere kernels en kernels/ (se omite si faltan)
    needs_dem: requiere GeoTIFF en data/raw/ (se omite si faltan)
filterwarnings =
    ignore::DeprecationWarning:streamlit.*
    ignore:.*pkg_resources.*:UserWarning
